name: Build & Release BC App to GitHub and Azure

# Parameters:
# AZURE_STORAGE_ACCOUNT -	Storage Account Name in Azure (Global secrets)
# AZURE_CONTAINER_NAME	- Container Name in Storage (Global variable)
# AZURE_SAS_TOKEN - SAS Token with write permission (Global secrets)
# GITHUB_TOKEN	- GitHub Token 

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: 
      - completed
    branches:
      - main

defaults:
  run:
    shell: powershell

permissions:
  actions: read
  contents: read
  id-token: write
  pages: read

env:
  workflowDepth: 1
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    needs: [ ]
    runs-on: [ self-hosted ]
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
      environmentsMatrixJson: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentsMatrixJson }}
      environmentCount: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentCount }}
      deploymentEnvironmentsJson: ${{ steps.DetermineDeploymentEnvironments.outputs.DeploymentEnvironmentsJson }}
      generateALDocArtifact: ${{ steps.DetermineDeploymentEnvironments.outputs.GenerateALDocArtifact }}
      deployALDocArtifact: ${{ steps.DetermineDeploymentEnvironments.outputs.DeployALDocArtifact }}
      deliveryTargetsJson: ${{ steps.DetermineDeliveryTargets.outputs.DeliveryTargetsJson }}
      githubRunner: ${{ steps.ReadSettings.outputs.GitHubRunnerJson }}
      githubRunnerShell: ${{ steps.ReadSettings.outputs.GitHubRunnerShell }}
      projects: ${{ steps.determineProjectsToBuild.outputs.ProjectsJson }}
      skippedProjects: ${{ steps.determineProjectsToBuild.outputs.SkippedProjectsJson }}
      projectDependenciesJson: ${{ steps.determineProjectsToBuild.outputs.ProjectDependenciesJson }}
      buildOrderJson: ${{ steps.determineProjectsToBuild.outputs.BuildOrderJson }}
      baselineWorkflowRunId: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ steps.determineProjectsToBuild.outputs.BaselineWorkflowSHA }}
      workflowDepth: ${{ steps.DetermineWorkflowDepth.outputs.WorkflowDepth }}
      powerPlatformSolutionFolder: ${{ steps.DeterminePowerPlatformSolutionFolder.outputs.powerPlatformSolutionFolder }}
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v7.0
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v7.0
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v7.0
        with:
          shell: powershell
          get: type,powerPlatformSolutionFolder,useGitSubmodules

      - name: Read submodules token
        id: ReadSubmodulesToken
        if: env.useGitSubmodules != 'false' && env.useGitSubmodules != ''
        uses: microsoft/AL-Go-Actions/ReadSecrets@v7.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '-gitSubmodulesToken'

      - name: Checkout Submodules
        if: env.useGitSubmodules != 'false' && env.useGitSubmodules != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          submodules: ${{ env.useGitSubmodules }}
          token: '${{ fromJson(steps.ReadSubmodulesToken.outputs.Secrets).gitSubmodulesToken }}'

      - name: Determine Workflow Depth
        id: DetermineWorkflowDepth
        run: |
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "WorkflowDepth=$($env:workflowDepth)"

      - name: Determine Projects To Build
        id: determineProjectsToBuild
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v7.0
        with:
          shell: powershell
          maxBuildDepth: ${{ env.workflowDepth }}

      - name: Determine PowerPlatform Solution Folder
        id: DeterminePowerPlatformSolutionFolder
        if: env.type == 'PTE'
        run: |
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "powerPlatformSolutionFolder=$($env:powerPlatformSolutionFolder)"

      - name: Determine Delivery Target Secrets
        id: DetermineDeliveryTargetSecrets
        uses: microsoft/AL-Go-Actions/DetermineDeliveryTargets@v7.0
        with:
          shell: powershell
          projectsJson: '${{ steps.determineProjectsToBuild.outputs.ProjectsJson }}'
          checkContextSecrets: 'false'

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v7.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: ${{ steps.DetermineDeliveryTargetSecrets.outputs.ContextSecrets }}

      - name: Determine Delivery Targets
        id: DetermineDeliveryTargets
        uses: microsoft/AL-Go-Actions/DetermineDeliveryTargets@v7.0
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: powershell
          projectsJson: '${{ steps.determineProjectsToBuild.outputs.ProjectsJson }}'
          checkContextSecrets: 'true'

      - name: Determine Deployment Environments
        id: DetermineDeploymentEnvironments
        uses: microsoft/AL-Go-Actions/DetermineDeploymentEnvironments@v7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          getEnvironments: '*'
          type: 'CD'

  CheckForUpdates:
    needs: [ Initialization ]
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v7.0
        with:
          shell: powershell
          get: templateUrl

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v7.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'ghTokenWorkflow'

      - name: Check for updates to AL-Go system files
        uses: microsoft/AL-Go-Actions/CheckForUpdates@v7.0
        with:
          shell: powershell
          templateUrl: ${{ env.templateUrl }}
          token: ${{ fromJson(steps.ReadSecrets.outputs.Secrets).ghTokenWorkflow }}
          downloadLatest: true

  DownloadDependencies:
    needs: [ Initialization ]
    runs-on: [ self-hosted ]
    steps:
      - name: Read installApps from settings.json
        shell: powershell
        run: |
          $settingsPath = Join-Path $env:GITHUB_WORKSPACE ".AL-Go/settings.json"
          if (-not (Test-Path $settingsPath)) {
              Write-Error "settings.json not found at $settingsPath"
              exit 1
          }

          try {
              $settings = Get-Content -Path $settingsPath -Raw | ConvertFrom-Json
          } catch {
              Write-Error "Failed to parse settings.json: $($_.Exception.Message)"
              exit 1
          }

          $installApps = $settings.installApps
          if (-not $installApps -or $installApps.Count -eq 0) {
            Write-Warning "installApps section missing or empty in settings.json. Skipping dependency download."
            Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "installApps="
            return
          }

          $installAppsJson = $installApps | ConvertTo-Json -Compress
          Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "installApps=$installAppsJson"

      - name: Ensure installApps available
        run: |
          if ([string]::IsNullOrWhiteSpace($env:installApps)) {
            Write-Host "installApps setting not found. Continuing without downloading dependencies."
          } else {
            Write-Host "installApps setting found. Proceeding with dependency download."
          }

      - name: Download dependencies defined in installApps
        shell: powershell
        run: |
          $errorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          if ([string]::IsNullOrWhiteSpace($env:installApps)) {
            Write-Host "installApps not provided. Skipping dependency download."
            return
          }

          $installAppsRaw = $env:installApps
          try {
              $installApps = $installAppsRaw | ConvertFrom-Json
          } catch {
              Write-Error "installApps is not valid JSON: $installAppsRaw"
              exit 1
          }

          if (-not $installApps -or $installApps.Count -eq 0) {
            Write-Host "installApps array is empty. Skipping dependency download."
            return
          }

          $tempPath = Join-Path $env:RUNNER_TEMP "dependencies"
          if (-not (Test-Path $tempPath)) {
              New-Item -ItemType Directory -Path $tempPath -Force | Out-Null
          }

          foreach ($url in $installApps) {
              if ([string]::IsNullOrWhiteSpace($url)) { continue }
              $uri = [System.Uri]$url
              $fileName = [System.Web.HttpUtility]::UrlDecode([System.IO.Path]::GetFileName($uri.AbsolutePath))
              if ([string]::IsNullOrWhiteSpace($fileName)) {
                  $fileName = "dependency_$([guid]::NewGuid().ToString()).app"
              }
              $destination = Join-Path $tempPath $fileName
              Write-Host "Downloading $url to $destination"
              Invoke-WebRequest -Uri $url -OutFile $destination
              if (-not (Test-Path $destination)) {
                  Write-Error "Failed to download $url"
                  exit 1
              }
          }

          Write-Host "Downloaded files:"
          Get-ChildItem $tempPath | ForEach-Object {
              Write-Host "  - $($_.Name) ($($_.Length) bytes)"
          }
          
      - name: Upload dependencies as artifact
        if: ${{ env.installApps != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: ${{ runner.temp }}/dependencies/
          retention-days: 1
          if-no-files-found: error
      
      - name: Copy dependencies to packages folder
        if: ${{ env.installApps != '' }}
        shell: powershell
        run: |
          $errorActionPreference = "Stop"
          $tempDependenciesPath = Join-Path $env:RUNNER_TEMP "dependencies"
          $dependenciesPath = ".dependencies"
          $packagesPath = ".packages"

          if (-not (Test-Path $tempDependenciesPath)) {
              Write-Error "Temp dependencies folder not found at $tempDependenciesPath"
              exit 1
          }

          if (-not (Test-Path $dependenciesPath)) {
              New-Item -ItemType Directory -Path $dependenciesPath -Force | Out-Null
          }

          Copy-Item -Path (Join-Path $tempDependenciesPath '*') -Destination $dependenciesPath -Recurse -Force
          Write-Host "Copied dependencies from $tempDependenciesPath to $dependenciesPath"

          Write-Host "Checking dependencies folder: $dependenciesPath"
          if (Test-Path $dependenciesPath) {
              Write-Host "Creating packages folder: $packagesPath"
              if (-not (Test-Path $packagesPath)) {
                  New-Item -ItemType Directory -Path $packagesPath -Force | Out-Null
              }

              Write-Host "Copying files from $dependenciesPath to $packagesPath"
              $downloadedApps = Get-ChildItem -Path $dependenciesPath -Filter "*.app" -Recurse
              if ($downloadedApps.Count -eq 0) {
                  Write-Host "No .app files found in dependencies."
              }

              foreach ($app in $downloadedApps) {
                  $destination = Join-Path $packagesPath $app.Name
                  Write-Host "Copying $($app.Name) to $destination"
                  Copy-Item -Path $app.FullName -Destination $destination -Force
              }

              Write-Host "Creating dependencies archive"
              $zipPath = Join-Path $dependenciesPath "dependencies.zip"
              if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
              Compress-Archive -Path (Join-Path $packagesPath "*.app") -DestinationPath $zipPath -Force

              Write-Host "Files in packages folder:"
              Get-ChildItem $packagesPath -Filter "*.app" | ForEach-Object {
                  Write-Host "  - $($_.Name) ($($_.Length) bytes)"
              }

              # Skopiuj dependencies.zip do katalogu tymczasowego
              Copy-Item -Path $zipPath -Destination $tempDependenciesPath -Force

              Write-Host "Dependencies archive created at $zipPath"
              Write-Host "Files in dependencies archive:"
              Get-ChildItem -Path $zipPath -Recurse | ForEach-Object {
                  Write-Host "  - $($_.Name) ($($_.Length) bytes)"
              }
          } else {
              Write-Host "Dependencies folder not found"
          }
          
  Build:
    needs: [ Initialization, DownloadDependencies ]
    if: (!failure()) && (!cancelled()) && fromJson(needs.Initialization.outputs.buildOrderJson)[0].projectsCount > 0
    strategy:
      matrix:
        include: ${{ fromJson(needs.Initialization.outputs.buildOrderJson)[0].buildDimensions }}
      fail-fast: false
    name: Build ${{ matrix.projectName }} (${{ matrix.buildMode }})
    uses: ./.github/workflows/_BuildALGoProject.yaml
    secrets: inherit
    with:
      shell: ${{ matrix.githubRunnerShell }}
      runsOn: ${{ matrix.githubRunner }}
      project: ${{ matrix.project }}
      projectName: ${{ matrix.projectName }}
      buildMode: ${{ matrix.buildMode }}
      skippedProjectsJson: ${{ needs.Initialization.outputs.skippedProjects }}
      projectDependenciesJson: ${{ needs.Initialization.outputs.projectDependenciesJson }}
      baselineWorkflowRunId: ${{ needs.Initialization.outputs.baselineWorkflowRunId }}
      baselineWorkflowSHA: ${{ needs.Initialization.outputs.baselineWorkflowSHA }}
      secrets: 'licenseFileUrl,codeSignCertificateUrl,*codeSignCertificatePassword,keyVaultCertificateUrl,*keyVaultCertificatePassword,keyVaultClientId,gitHubPackagesContext,applicationInsightsConnectionString'
      signArtifacts: true
      useArtifactCache: true
          
  Deliver:
    needs: [ Initialization, Build ]
    if: (!cancelled()) && (needs.Build.result == 'success' || needs.Build.result == 'skipped')
    strategy:
      matrix:
        include: ${{ fromJson(needs.Initialization.outputs.buildOrderJson)[0].buildDimensions }}
    runs-on: [ self-hosted ]
    name: Deliver Artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50

      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: '.artifacts'

      - name: Generate git log file for each app artifact
        shell: powershell
        run: |
          $errorActionPreference = "Stop"

          $appsFolder = Get-ChildItem -Path ".artifacts" -Directory | Where-Object { $_.Name -like "*-Apps-*" } | Select-Object -First 1
          if (-not $appsFolder) {
            Write-Error "No folder with 'Apps' in its name found in the .artifacts directory"
            exit 1
          }
          $sourcePath = $appsFolder.FullName

          # Self-hosted runner can have mismatched file ownership; mark workspace as safe for git.
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

          $appJsonPath = Join-Path $env:GITHUB_WORKSPACE "app.json"
          $appVersion = ""
          if (Test-Path $appJsonPath) {
            $appJson = Get-Content -Path $appJsonPath -Raw | ConvertFrom-Json
            $appVersion = $appJson.version
            Write-Host "App version from app.json: $appVersion"
          } else {
            Write-Warning "app.json not found, version will not be included in log file"
          }

          Get-ChildItem -Path $sourcePath -Filter *.app | ForEach-Object {
            $appName = $_.BaseName
            $logFile = Join-Path $sourcePath "$appName.log.txt"
            Write-Host "Generating git log for $($_.Name) -> $logFile"
            if ($appVersion) {
              "Version : $appVersion`n" | Out-File -FilePath "$logFile" -Encoding utf8
              git log --pretty=format:"%nAuthor : %an %nDate/Time : %ad%nCommit : %s" --date=short | Out-File -FilePath "$logFile" -Encoding utf8 -Append
            } else {
              git log --pretty=format:"%nAuthor : %an %nDate/Time : %ad%nCommit : %s" --date=short | Out-File -FilePath "$logFile" -Encoding utf8
            }
            Write-Host "Git log file created: $logFile"
          }

      - name: Upload *.app artifacts to Azure Blob Storage from "Apps" subfolder
        shell: powershell
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
          AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
        run: |
          $appsFolder = Get-ChildItem -Path ".artifacts" -Directory | Where-Object { $_.Name -like "*-Apps-*" } | Select-Object -First 1
          if (-not $appsFolder) {
            Write-Error "No folder with 'Apps' in its name found in the .artifacts directory"
            exit 1
          }
          $sourcePath = $appsFolder.FullName
          $destinationPath = "$env:AZURE_CONTAINER_NAME/$env:GITHUB_REPOSITORY"
          Write-Host "Uploading artifacts to Azure Blob Storage... $destinationPath"

          Get-ChildItem -Path $sourcePath -Filter *.app | ForEach-Object {
            $file = $_.FullName
            Write-Host "Uploading file... $file"
            az storage blob upload `
              --account-name $env:AZURE_STORAGE_ACCOUNT `
              --container-name $env:AZURE_CONTAINER_NAME `
              --name "$env:GITHUB_REPOSITORY/$($_.Name)" `
              --file $file `
              --sas-token $env:AZURE_SAS_TOKEN `
              --overwrite
          }

          Get-ChildItem -Path $sourcePath -Filter *.log.txt | ForEach-Object {
            $file = $_.FullName
            Write-Host "Uploading log file... $file"
            az storage blob upload `
              --account-name $env:AZURE_STORAGE_ACCOUNT `
              --container-name $env:AZURE_CONTAINER_NAME `
              --name "$env:GITHUB_REPOSITORY/$($_.Name)" `
              --file $file `
              --sas-token $env:AZURE_SAS_TOKEN `
              --overwrite
          } 

      
